<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Agenda</title>

  <!-- Ícone e PWA -->
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#4f46e5" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    @keyframes popCheck {
      0% { transform: scale(0.7); opacity: 0.5; }
      60% { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }
    .check-pop {
      animation: popCheck 0.22s ease-out forwards;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .shake-anim {
      animation: shake 0.25s ease-in-out;
    }

    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-indigo-500/30">

  <!-- Tela de Bloqueio por Senha -->
  <div id="lock-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 px-4 backdrop-blur-md">
    <div id="lock-card" class="w-full max-w-sm rounded-3xl border border-slate-800 bg-slate-900 p-7 shadow-2xl">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-blue-600 shadow-lg shadow-indigo-500/25">
        <svg class="h-7 w-7 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-linecap="round" />
        </svg>
      </div>

      <h2 class="text-center text-xl font-extrabold text-white">Minha Agenda</h2>
      <p class="mt-1 text-center text-xs text-slate-400">Digite sua senha para acessar suas tarefas</p>

      <form id="lock-form" class="mt-6 space-y-4">
        <div>
          <input id="password-input" type="password" autocomplete="current-password" required placeholder="Digite a senha..."
            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3.5 text-center text-base tracking-widest text-white placeholder-slate-500 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/25" />
          <p id="lock-error" class="mt-2 hidden text-center text-xs font-semibold text-rose-400">Senha incorreta. Tente novamente.</p>
        </div>

        <button type="submit"
          class="w-full rounded-xl bg-indigo-600 py-3.5 text-sm font-bold text-white shadow-lg shadow-indigo-600/25 transition hover:bg-indigo-500 active:scale-[0.99]">
          Entrar
        </button>
      </form>
    </div>
  </div>

  <!-- Topo -->
  <header class="sticky top-0 z-30 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3.5 sm:px-6 lg:px-8">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-blue-600 shadow-lg shadow-indigo-500/20">
          <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="3" />
            <path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white sm:text-xl">Minha Agenda</h1>
          <p class="text-xs text-slate-400">Organização diária e mensal</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <button id="btn-toggle-other-days"
          class="inline-flex items-center gap-2 rounded-xl border border-slate-700/80 bg-slate-900 px-3.5 py-2 text-xs font-semibold text-slate-200 transition hover:border-indigo-500/60 hover:bg-slate-800 sm:text-sm">
          <svg class="h-4 w-4 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round" />
          </svg>
          <span>Dias com tarefas</span>
        </button>

        <div id="sync-badge"
          class="inline-flex items-center gap-2 rounded-full border border-amber-500/30 bg-amber-500/10 px-3 py-1.5 text-xs font-medium text-amber-300">
          <span id="sync-dot" class="h-2 w-2 rounded-full bg-amber-400"></span>
          <span id="sync-text">Salvo Localmente</span>
        </div>

        <button id="btn-lock-app" title="Bloquear agenda"
          class="flex h-9 w-9 items-center justify-center rounded-xl border border-slate-700/80 bg-slate-900 text-slate-400 transition hover:border-rose-500/60 hover:text-rose-400">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

    <!-- Barra de Navegação do Dia + Alternador Semana / Mês -->
    <section class="mb-6 rounded-2xl border border-slate-800 bg-slate-900/70 p-4 shadow-xl sm:p-5">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-2 sm:gap-3">
          <button id="btn-prev-day" title="Dia anterior"
            class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-700/80 bg-slate-800/80 text-slate-200 transition hover:border-indigo-500 hover:bg-slate-800">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <div>
            <div class="flex items-center gap-2">
              <h2 id="selected-day-title" class="text-xl font-extrabold capitalize text-white sm:text-2xl">Hoje</h2>
              <button id="btn-go-today"
                class="hidden rounded-lg bg-indigo-500/20 px-2.5 py-1 text-xs font-semibold text-indigo-300 transition hover:bg-indigo-500/30">
                Voltar para Hoje
              </button>
            </div>
            <p id="selected-day-date" class="text-xs font-medium capitalize text-slate-400 sm:text-sm"></p>
          </div>

          <button id="btn-next-day" title="Próximo dia"
            class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-700/80 bg-slate-800/80 text-slate-200 transition hover:border-indigo-500 hover:bg-slate-800">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <div class="flex flex-wrap items-center gap-2.5">
          <div class="inline-flex rounded-
