<head>

<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

    <!-- Fonte Inter para tipografia moderna e legível -->

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }

    <!-- React 18 (UMD), ReactDOM e Babel Standalone via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat SDK v10 via CDN (app, auth e firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Barra de rolagem discreta para o Kanban horizontal e listas internas */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #94a3b8;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #334155;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #475569;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // =========================================================================
        // CONFIGURAÇÃO DO FIREBASE (Credenciais do projeto minhaagenda-1dd5b)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD3BlVz3O8y6AF6IQkdG1nKNAZZ-O4jcMw",
  authDomain: "minha-agenda-d822c.firebaseapp.com",
  projectId: "minha-agenda-d822c",
  storageBucket: "minha-agenda-d822c.firebasestorage.app",
  messagingSenderId: "424693571025",
  appId: "1:424693571025:web:2f068af3f077f36e5a54f0"
        };

        const LOCAL_STORAGE_KEY = 'agenda-de-tarefas-v2';
        const THEME_STORAGE_KEY = 'agenda-dark-mode';

        // =========================================================================
        // ÍCONES VETORIAIS (SVG Inline para nitidez máxima)
        // =========================================================================
        const RocketIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
                <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
                <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
                <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
            </svg>
        );

        // Símbolo estilizado da Nike (Swoosh) em branco para tarefas concluídas
        const NikeSwooshIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" className="w-4 h-4 fill-white">
                <path d="M21 8.719L7.836 14.303C6.74 14.768 5.818 15 5.075 15c-.836 0-1.445-.295-1.819-.884-.485-.76-.273-1.982.559-3.272.494-.754 1.122-1.446 1.734-2.108-.144.234-1.415 2.349-.025 3.345.275.2.666.298 1.147.298.386 0 .829-.063 1.316-.19L21 8.719z" />
            </svg>
        );

        const FlagIcon = ({ filled = false, size = 15 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                <line x1="4" y1="22" x2="4" y2="15"></line>
            </svg>
        );

        const PlusIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const TrashIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        );

        const ChevronLeftIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        );

        const ChevronRightIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );

        const SunIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        );

        const MoonIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        );

        // =========================================================================
        // COMPONENTE PRINCIPAL: AgendaApp
        // =========================================================================
        function AgendaApp() {
            // Carrega dados locais imediatamente para inicialização instantânea
            const [tasks, setTasks] = useState(() => {
                try {
                    const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });

            // Status da nuvem: 'connecting' | 'cloud' | 'local'
            const [syncStatus, setSyncStatus] = useState('connecting');
            const [baseDate, setBaseDate] = useState(new Date());
            const [newTasksInputs, setNewTasksInputs] = useState({});
            const [newTasksPriority, setNewTasksPriority] = useState({});
            const [editingTaskId, setEditingTaskId] = useState(null);
            const [editingText, setEditingText] = useState('');

            // Tema claro/escuro com persistência no localStorage
            const [darkMode, setDarkMode] = useState(() => {
                try {
                    const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
                    if (savedTheme !== null) return JSON.parse(savedTheme);
                    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                } catch {
                    return false;
                }
            });

            // Referência ao documento Firestore
            const docRefRef = useRef(null);

            // Aplica o tema no elemento raiz <html>
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                try {
                    localStorage.setItem(THEME_STORAGE_KEY, JSON.stringify(darkMode));
                } catch (e) {
                    console.warn('Não foi possível salvar o tema:', e);
                }
            }, [darkMode]);

            // =====================================================================
            // CONEXÃO COM FIREBASE + SINCRONIZAÇÃO EM TEMPO REAL + TIMEOUT DE 5s
            // =====================================================================
            useEffect(() => {
                let unsubscribe = null;
                let isMounted = true;
                let resolved = false;

                // Timeout de segurança (5s) para nunca travar em "Conectando..."
                const fallbackTimer = setTimeout(() => {
                    if (isMounted && !resolved) {
                        setSyncStatus('local');
                    }
                }, 5000);

                const initFirebase = async () => {
                    try {
                        if (typeof firebase === 'undefined') {
                            throw new Error('Firebase SDK não disponível.');
                        }

                        if (!firebase.apps.length) {
                            firebase.initializeApp(firebaseConfig);
                        }

                        const auth = firebase.auth();
                        const db = firebase.firestore();

                        // Login anônimo para acesso seguro ao Firestore
                        await auth.signInAnonymously();

                        if (!isMounted) return;

                        // Documento compartilhado para sincronização entre dispositivos
                        const docRef = db.collection('agenda_tarefas').doc('minha_agenda');
                        docRefRef.current = docRef;

                        // Escuta atualizações em tempo real
                        unsubscribe = docRef.onSnapshot(
                            (docSnap) => {
                                if (!isMounted) return;
                                resolved = true;
                                clearTimeout(fallbackTimer);
                                setSyncStatus('cloud');

                                if (docSnap.exists) {
                                    const data = docSnap.data();
                                    if (Array.isArray(data.tasks)) {
                                        setTasks(data.tasks);
                                        try {
                                            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data.tasks));
                                        } catch (e) {
                                            console.warn('Erro ao atualizar cache local:', e);
                                        }
                                    }
                                } else {
                                    // Inicializa documento na nuvem com tarefas locais existentes
                                    try {
                                        const localRaw = localStorage.getItem(LOCAL_STORAGE_KEY);
                                        const localTasks = localRaw ? JSON.parse(localRaw) : [];
                                        docRef.set({
                                            tasks: localTasks,
                                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                        }, { merge: true }).catch(() => {});
                                    } catch (e) {
                                        console.warn('Erro ao inicializar nuvem:', e);
                                    }
                                }
                            },
                            (error) => {
                                console.warn('Erro no Firestore listener, usando modo local:', error);
                                if (isMounted) {
                                    resolved = true;
                                    clearTimeout(fallbackTimer);
                                    setSyncStatus('local');
                                }
                            }
                        );
                    } catch (error) {
                        console.warn('Falha ao conectar no Firebase, usando modo local:', error);
                        if (isMounted) {
                            resolved = true;
                            clearTimeout(fallbackTimer);
                            setSyncStatus('local');
                        }
                    }
                };

                initFirebase();

                return () => {
                    isMounted = false;
                    clearTimeout(fallbackTimer);
                    if (unsubscribe) unsubscribe();
                };
            }, []);

            // =====================================================================
            // PERSISTÊNCIA UNIFICADA (Estado + localStorage + Firestore)
            // =====================================================================
            const persistTasks = (updatedTasks) => {
                setTasks(updatedTasks);

                // Backup local imediato
                try {
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(updatedTasks));
                } catch (e) {
                    console.warn('Erro ao salvar no localStorage:', e);
                }

                // Gravação na nuvem se conectado
                if (docRefRef.current && syncStatus === 'cloud') {
                    docRefRef.current.set({
                        tasks: updatedTasks,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch((err) => {
                        console.warn('Erro ao sincronizar na nuvem:', err);
                        setSyncStatus('local');
                    });
                }
            };

            // =====================================================================
            // CÁLCULO DA SEMANA E FORMATAÇÃO DE DATAS
            // =====================================================================
            const getStartOfWeek = (date) => {
                const d = new Date(date);
                d.setHours(0, 0, 0, 0);
                d.setDate(d.getDate() - d.getDay()); // Inicia no Domingo
                return d;
            };

            const formatDateStr = (date) => {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            };

            const startOfWeek = getStartOfWeek(baseDate);
            const weekDays = Array.from({ length: 7 }).map((_, i) => {
                const d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);
                return d;
            });

            const changeWeek = (offset) => {
                const next = new Date(baseDate);
                next.setDate(baseDate.getDate() + offset * 7);
                setBaseDate(next);
            };

            const goToToday = () => setBaseDate(new Date());

            // Formata Mês e Ano em Português (ex: "Novembro de 2026")
            const rawMonthYear = startOfWeek.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
            const formattedMonthYear = rawMonthYear.charAt(0).toUpperCase() + rawMonthYear.slice(1);

            const DIAS_SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            const todayStr = formatDateStr(new Date());

            // =====================================================================
            // OPERAÇÕES DE TAREFAS
            // =====================================================================
            const handleInputChange = (dateStr, value) => {
                setNewTasksInputs(prev => ({ ...prev, [dateStr]: value }));
            };

            const toggleNewTaskPriority = (dateStr) => {
                setNewTasksPriority(prev => ({ ...prev, [dateStr]: !prev[dateStr] }));
            };

            const addTask = (e, dateStr) => {
                e.preventDefault();
                const text = (newTasksInputs[dateStr] || '').trim();
                if (!text) return;

                const newTask = {
                    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                    text,
                    date: dateStr,
                    completed: false,
                    priority: !!newTasksPriority[dateStr],
                    createdAt: Date.now()
                };

                persistTasks([...tasks, newTask]);
                setNewTasksInputs(prev => ({ ...prev, [dateStr]: '' }));
                setNewTasksPriority(prev => ({ ...prev, [dateStr]: false }));
            };

            const toggleTaskCompleted = (id) => {
                const updated = tasks.map(t =>
                    t.id === id ? { ...t, completed: !t.completed } : t
                );
                persistTasks(updated);
            };

            const toggleTaskPriority = (id) => {
                const updated = tasks.map(t =>
                    t.id === id ? { ...t, priority: !t.priority } : t
                );
                persistTasks(updated);
            };

            const deleteTask = (id) => {
                const updated = tasks.filter(t => t.id !== id);
                persistTasks(updated);
            };

            const startEdit = (task) => {
                setEditingTaskId(task.id);
                setEditingText(task.text);
            };

            const cancelEdit = () => {
                setEditingTaskId(null);
                setEditingText('');
            };

            const saveEdit = (id) => {
                const trimmed = editingText.trim();
                if (!trimmed) {
                    cancelEdit();
                    return;
                }
                const updated = tasks.map(t =>
                    t.id === id ? { ...t, text: trimmed } : t
                );
                persistTasks(updated);
                setEditingTaskId(null);
                setEditingText('');
            };

            // Progresso dinâmico da semana exibida
            const weekDateStrings = new Set(weekDays.map(formatDateStr));
            const weekTasks = tasks.filter(t => weekDateStrings.has(t.date));
            const completedWeekTasks = weekTasks.filter(t => t.completed).length;
            const weekProgress = weekTasks.length === 0
                ? 0
                : Math.round((completedWeekTasks / weekTasks.length) * 100);

            return (
                <div className="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col transition-colors duration-300">
                    <div className="w-full max-w-[1680px] mx-auto px-3 sm:px-6 py-4 sm:py-6 flex-1 flex flex-col">

                        {/* ===================================================== */}
                        {/* CABEÇALHO SUPERIOR                                     */}
                        {/* ===================================================== */}
                        <header className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 p-4 sm:px-6 sm:py-5 mb-5 flex flex-col lg:flex-row justify-between items-center gap-4 transition-colors">

                            {/* Esquerda: Ícone Foguete + Título + Barra de Progresso */}
                            <div className="flex items-center gap-3.5 w-full lg:w-auto justify-center lg:justify-start">
                                <div className="flex-shrink-0 w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white shadow-md shadow-indigo-500/25 flex items-center justify-center">
                                    <RocketIcon />
                                </div>
                                <div className="min-w-0">
                                    <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">
                                        Agenda de Tarefas
                                    </h1>
                                    <div className="flex items-center gap-2.5 mt-1.5">
                                        <span className="text-xs font-medium text-slate-500 dark:text-slate-400 whitespace-nowrap">
                                            Progresso da Semana:
                                        </span>
                                        <div className="w-28 sm:w-36 h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                                            <div
                                                className="h-full bg-gradient-to-r from-emerald-500 to-indigo-500 rounded-full transition-all duration-500 ease-out"
                                                style={{ width: `${weekProgress}%` }}
                                            ></div>
                                        </div>
                                        <span className="text-xs font-bold text-indigo-600 dark:text-indigo-400 tabular-nums">
                                            {weekProgress}%
                                        </span>
                                    </div>
                                </div>
                            </div>

                            {/* Centro: Navegação de Semanas */}
                            <div className="flex items-center bg-slate-50 dark:bg-slate-800/80 rounded-xl border border-slate-200 dark:border-slate-700/80 p-1 shadow-inner">
                                <button
                                    onClick={() => changeWeek(-1)}
                                    className="p-2 text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-white dark:hover:bg-slate-700 rounded-lg transition-all"
                                    title="Semana anterior"
                                    aria-label="Semana anterior"
                                >
                                    <ChevronLeftIcon />
                                </button>
                                <div className="min-w-[168px] sm:min-w-[190px] text-center font-semibold text-sm sm:text-base text-slate-700 dark:text-slate-200 px-2 select-none">
                                    {formattedMonthYear}
                                </div>
                                <button
                                    onClick={() => changeWeek(1)}
                                    className="p-2 text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-white dark:hover:bg-slate-700 rounded-lg transition-all"
                                    title="Próxima semana"
                                    aria-label="Próxima semana"
                                >
                                    <ChevronRightIcon />
                                </button>
                            </div>

                            {/* Direita: Status Nuvem + Tema + Ir para Hoje */}
                            <div className="flex items-center flex-wrap justify-center gap-2.5">
                                <div
                                    className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-600 dark:text-slate-300 select-none"
                                    title={
                                        syncStatus === 'cloud'
                                            ? 'Sincronizado em tempo real com o Firebase'
                                            : syncStatus === 'local'
                                            ? 'Salvo localmente neste navegador'
                                            : 'Conectando à nuvem...'
                                    }
                                >
                                    {syncStatus === 'cloud' && (
                                        <>
                                            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.75)]"></span>
                                            <span>Nuvem Ativa</span>
                                        </>
                                    )}
                                    {syncStatus === 'local' && (
                                        <>
                                            <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                                            <span>Salvo Localmente</span>
                                        </>
                                    )}
                                    {syncStatus === 'connecting' && (
                                        <>
                                            <span className="w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse"></span>
                                            <span>Conectando...</span>
                                        </>
                                    )}
                                </div>

                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-indigo-600 dark:hover:text-amber-400 transition-colors"
                                    title={darkMode ? 'Ativar modo claro' : 'Ativar modo escuro'}
                                    aria-label="Alternar tema"
                                >
                                    {darkMode ? <SunIcon /> : <MoonIcon />}
                                </button>

                                <button
                                    onClick={goToToday}
                                    className="px-4 py-2 rounded-xl bg-indigo-50 dark:bg-indigo-500/15 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-500/25 font-semibold text-sm border border-indigo-200/80 dark:border-indigo-500/30 transition-colors"
                                >
                                    Ir para Hoje
                                </button>
                            </div>
                        </header>

                        {/* ===================================================== */}
                        {/* PAINEL KANBAN HORIZONTAL: 7 DIAS DA SEMANA             */}
                        {/* ===================================================== */}
                        <main className="flex-1 flex flex-nowrap gap-3.5 overflow-x-auto pb-4 snap-x snap-mandatory custom-scrollbar items-stretch">
                            {weekDays.map((day, index) => {
                                const dateStr = formatDateStr(day);
                                const isToday = dateStr === todayStr;
                                const inputValue = newTasksInputs[dateStr] || '';
                                const isInputPriority = !!newTasksPriority[dateStr];

                                // Ordenação:
                                // 1º Pendentes com prioridade -> 2º Pendentes normais -> 3º Concluídas no final
                                const dayTasks = tasks
                                    .filter(t => t.date === dateStr)
                                    .sort((a, b) => {
                                        if (a.completed !== b.completed) return a.completed ? 1 : -1;
                                        if (!!a.priority !== !!b.priority) return a.priority ? -1 : 1;
                                        return (a.createdAt || 0) - (b.createdAt || 0);
                                    });

                                return (
                                    <section
                                        key={dateStr}
                                        className={`flex-shrink-0 flex-1 min-w-[265px] lg:min-w-[215px] snap-center rounded-2xl border flex flex-col min-h-[520px] h-[calc(100vh-200px)] max-h-[760px] transition-all duration-200 ${
                                            isToday
                                                ? 'bg-white dark:bg-slate-900 border-indigo-500 dark:border-indigo-500 ring-2 ring-indigo-500/15 dark:ring-indigo-500/20 shadow-md shadow-indigo-500/5'
                                                : 'bg-white dark:bg-slate-900 border-slate-200/80 dark:border-slate-800 shadow-sm'
                                        }`}
                                    >
                                        {/* Cabeçalho do Dia */}
                                        <div
                                            className={`px-4 py-3.5 rounded-t-2xl border-b transition-colors ${
                                                isToday
                                                    ? 'bg-indigo-50/90 dark:bg-indigo-950/50 border-indigo-100 dark:border-indigo-900/60'
                                                    : 'bg-slate-50/70 dark:bg-slate-800/40 border-slate-100 dark:border-slate-800'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-2">
                                                    <h2
                                                        className={`text-sm font-bold uppercase tracking-wider ${
                                                            isToday
                                                                ? 'text-indigo-700 dark:text-indigo-400'
                                                                : 'text-slate-600 dark:text-slate-300'
                                                        }`}
                                                    >
                                                        {DIAS_SEMANA[index]}
                                                    </h2>
                                                    {isToday && (
                                                        <span className="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide rounded-full bg-indigo-600 text-white">
                                                            Hoje
                                                        </span>
                                                    )}
                                                </div>
                                                <span
                                                    className={`text-xl font-extrabold tabular-nums ${
                                                        isToday
                                                            ? 'text-indigo-700 dark:text-indigo-300'
                                                            : 'text-slate-900 dark:text-slate-100'
                                                    }`}
                                                >
                                                    {day.getDate()}
                                                </span>
                                            </div>
                                            <p className="text-xs font-medium text-slate-400 dark:text-slate-500 mt-0.5">
                                                {dayTasks.length} {dayTasks.length === 1 ? 'tarefa' : 'tarefas'}
                                            </p>
                                        </div>

                                        {/* Campo Nova Tarefa + Bandeira de Prioridade + Botão Adicionar */}
                                        <div className="p-2.5 border-b border-slate-100 dark:border-slate-800/80">
                                            <form
                                                onSubmit={(e) => addTask(e, dateStr)}
                                                className={`flex items-center gap-1 rounded-xl border p-1 transition-all ${
                                                    isInputPriority
                                                        ? 'bg-rose-50/60 dark:bg-rose-950/25 border-rose-300 dark:border-rose-500/50 focus-within:ring-2 focus-within:ring-rose-500/30'
                                                        : 'bg-slate-50 dark:bg-slate-800/70 border-slate-200 dark:border-slate-700 focus-within:bg-white dark:focus-within:bg-slate-800 focus-within:border-indigo-400 dark:focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/20'
                                                }`}
                                            >
                                                <input
                                                    type="text"
                                                    value={inputValue}
                                                    onChange={(e) => handleInputChange(dateStr, e.target.value)}
                                                    placeholder="Nova tarefa..."
                                                    className="flex-1 min-w-0 bg-transparent px-2 py-1.5 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none"
                                                />

                                                {/* Ícone clicável de Prioridade (Bandeira) */}
                                                <button
                                                    type="button"
                                                    onClick={() => toggleNewTaskPriority(dateStr)}
                                                    title={isInputPriority ? 'Prioridade alta ativada' : 'Marcar como prioridade'}
                                                    aria-label="Alternar prioridade da nova tarefa"
                                                    className={`flex-shrink-0 p-1.5 rounded-lg transition-all ${
                                                        isInputPriority
                                                            ? 'bg-rose-500 text-white shadow-sm shadow-rose-500/30 scale-105'
                                                            : 'text-slate-400 dark:text-slate-500 hover:text-rose-500 dark:hover:text-rose-400 hover:bg-slate-200/60 dark:hover:bg-slate-700/60'
                                                    }`}
                                                >
                                                    <FlagIcon filled={isInputPriority} size={15} />
                                                </button>

                                                <button
                                                    type="submit"
                                                    disabled={!inputValue.trim()}
                                                    title="Adicionar tarefa"
                                                    aria-label="Adicionar tarefa"
                                                    className="flex-shrink-0 p-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 dark:disabled:bg-slate-700 text-white disabled:text-slate-400 dark:disabled:text-slate-500 transition-colors"
                                                >
                                                    <PlusIcon />
                                                </button>
                                            </form>
                                        </div>

                                        {/* Lista de Tarefas do Dia */}
                                        <div className="p-2.5 flex-1 overflow-y-auto space-y-2 custom-scrollbar">
                                            {dayTasks.length === 0 ? (
                                                <div className="h-full flex items-center justify-center select-none">
                                                    <span className="text-sm font-medium text-slate-400 dark:text-slate-600">
                                                        Livre
                                                    </span>
                                                </div>
                                            ) : (
                                                dayTasks.map((task) => {
                                                    const isPriorityActive = !!task.priority && !task.completed;
                                                    return (
                                                        /* NOTA: Não aplicamos opacity no container pai quando concluído,
                                                           para que o marcador verde com símbolo da Nike fique em 100% de opacidade! */
                                                        <div
                                                            key={task.id}
                                                            className={`group relative flex items-start gap-2.5 p-2.5 rounded-xl border transition-all duration-200 ${
                                                                task.completed
                                                                    ? 'bg-slate-50/70 dark:bg-slate-800/30 border-slate-200/60 dark:border-slate-800/70'
                                                                    : isPriorityActive
                                                                    ? 'bg-rose-50/70 dark:bg-rose-950/25 border-rose-200/90 dark:border-rose-800/50 border-l-4 border-l-rose-500 dark:border-l-rose-500 shadow-sm'
                                                                    : 'bg-white dark:bg-slate-800/80 border-slate-200/70 dark:border-slate-700/70 hover:border-indigo-300 dark:hover:border-indigo-500/50 shadow-sm'
                                                            }`}
                                                        >
                                                            {/* Botão de Conclusão: Verde Vibrante + Símbolo da Nike em 100% opacidade quando feito */}
                                                            <button
                                                                type="button"
                                                                onClick={() => toggleTaskCompleted(task.id)}
                                                                className={`flex-shrink-0 mt-0.5 w-6 h-6 rounded-full flex items-center justify-center transition-all duration-200 focus:outline-none ${
                                                                    task.completed
                                                                        ? 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-md shadow-emerald-500/45 ring-2 ring-emerald-400/35 opacity-100 scale-105'
                                                                        : 'border-2 border-slate-300 dark:border-slate-600 hover:border-emerald-500 dark:hover:border-emerald-400 bg-transparent'
                                                                }`}
                                                                title={task.completed ? 'Desmarcar tarefa' : 'Marcar como concluída'}
                                                                aria-label={task.completed ? 'Desmarcar tarefa' : 'Concluir tarefa'}
                                                            >
                                                                {task.completed && <NikeSwooshIcon />}
                                                            </button>

                                                            {/* Texto da Tarefa (clique para editar inline; Enter ou sair do campo salva) */}
                                                            <div className="flex-1 min-w-0">
                                                                {editingTaskId === task.id ? (
                                                                    <input
                                                                        type="text"
                                                                        value={editingText}
                                                                        onChange={(e) => setEditingText(e.target.value)}
                                                                        onBlur={() => saveEdit(task.id)}
                                                                        onKeyDown={(e) => {
                                                                            if (e.key === 'Enter') saveEdit(task.id);
                                                                            if (e.key === 'Escape') cancelEdit();
                                                                        }}
                                                                        autoFocus
                                                                        className="w-full px-2 py-1 text-sm bg-white dark:bg-slate-900 border border-indigo-400 dark:border-indigo-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/30 text-slate-800 dark:text-slate-100"
                                                                    />
                                                                ) : (
                                                                    <div
                                                                        onClick={() => startEdit(task)}
                                                                        title="Clique para editar"
                                                                        className={`cursor-text pt-0.5 transition-opacity ${
                                                                            task.completed ? 'opacity-45' : 'opacity-100'
                                                                        }`}
                                                                    >
                                                                        <p
                                                                            className={`text-sm leading-snug break-words ${
                                                                                task.completed
                                                                                    ? 'line-through text-slate-500 dark:text-slate-400'
                                                                                    : isPriorityActive
                                                                                    ? 'font-medium text-slate-900 dark:text-slate-100'
                                                                                    : 'text-slate-700 dark:text-slate-200'
                                                                            }`}
                                                                        >
                                                                            {task.text}
                                                                        </p>
                                                                    </div>
                                                                )}
                                                            </div>

                                                            {/* Ações à Direita: Prioridade (Bandeira) e Excluir (Lixeira) */}
                                                            <div
                                                                className={`flex items-center flex-shrink-0 gap-0.5 transition-opacity ${
                                                                    task.completed
                                                                        ? 'opacity-40 hover:opacity-90'
                                                                        : 'opacity-100'
                                                                }`}
                                                            >
                                                                <button
                                                                    type="button"
                                                                    onClick={() => toggleTaskPriority(task.id)}
                                                                    className={`p-1 rounded-md transition-all ${
                                                                        task.priority && !task.completed
                                                                            ? 'text-rose-500 dark:text-rose-400 opacity-100 hover:bg-rose-100 dark:hover:bg-rose-900/40'
                                                                            : task.priority && task.completed
                                                                            ? 'text-rose-400 dark:text-rose-500 hover:bg-slate-200/60 dark:hover:bg-slate-700/60'
                                                                            : 'text-slate-300 dark:text-slate-600 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 hover:text-rose-500 dark:hover:text-rose-400 hover:bg-slate-100 dark:hover:bg-slate-700/60'
                                                                    }`}
                                                                    title={task.priority ? 'Remover prioridade' : 'Marcar como prioridade'}
                                                                    aria-label="Alternar prioridade"
                                                                >
                                                                    <FlagIcon filled={!!task.priority} size={14} />
                                                                </button>

                                                                <button
                                                                    type="button"
                                                                    onClick={() => deleteTask(task.id)}
                                                                    className="p-1 rounded-md text-slate-300 dark:text-slate-600 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition-all"
                                                                    title="Excluir tarefa"
                                                                    aria-label="Excluir tarefa"
                                                                >
                                                                    <TrashIcon />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </section>
                                );
                            })}
                        </main>
                    </div>
                </div>
            );
        }

        // Renderização da Aplicação
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AgendaApp />);
    </script>
</body>
</html>
