<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Agenda</title>

  <!-- Ícone e PWA -->
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#4f46e5" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    /* Animação do check verde estilo Nike */
    @keyframes popCheck {
      0% { transform: scale(0.6); opacity: 0.4; }
      60% { transform: scale(1.18); }
      100% { transform: scale(1); opacity: 1; }
    }
    .nike-check-anim {
      animation: popCheck 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Barra de rolagem discreta */
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-indigo-500/30">

  <!-- Topo -->
  <header class="sticky top-0 z-30 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3.5 sm:px-6 lg:px-8">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-blue-600 shadow-lg shadow-indigo-500/20">
          <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="3" />
            <path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white sm:text-xl">Minha Agenda</h1>
          <p id="header-subtitle" class="text-xs text-slate-400">Organização diária</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <!-- Botão Ver Outros Dias -->
        <button id="btn-toggle-other-days"
          class="inline-flex items-center gap-2 rounded-xl border border-slate-700/80 bg-slate-900 px-3.5 py-2 text-xs font-semibold text-slate-200 transition hover:border-indigo-500/60 hover:bg-slate-800 sm:text-sm">
          <svg class="h-4 w-4 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round" />
          </svg>
          <span>Ver outros dias</span>
        </button>

        <!-- Status Firebase -->
        <div id="sync-badge"
          class="inline-flex items-center gap-2 rounded-full border border-amber-500/30 bg-amber-500/10 px-3 py-1.5 text-xs font-medium text-amber-300">
          <span id="sync-dot" class="h-2 w-2 rounded-full bg-amber-400"></span>
          <span id="sync-text">Salvo Localmente</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

    <!-- Barra de Navegação do Dia -->
    <section class="mb-6 rounded-2xl border border-slate-800 bg-slate-900/70 p-4 shadow-xl sm:p-5">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <!-- Controle Anterior / Data Atual / Próximo -->
        <div class="flex items-center gap-2 sm:gap-3">
          <button id="btn-prev-day" title="Dia anterior"
            class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-700/80 bg-slate-800/80 text-slate-200 transition hover:border-indigo-500 hover:bg-slate-800">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <div>
            <div class="flex items-center gap-2">
              <h2 id="selected-day-title" class="text-xl font-extrabold capitalize text-white sm:text-2xl">Hoje</h2>
              <button id="btn-go-today"
                class="hidden rounded-lg bg-indigo-500/20 px-2.5 py-1 text-xs font-semibold text-indigo-300 transition hover:bg-indigo-500/30">
                Voltar para Hoje
              </button>
            </div>
            <p id="selected-day-date" class="text-xs font-medium capitalize text-slate-400 sm:text-sm"></p>
          </div>

          <button id="btn-next-day" title="Próximo dia"
            class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-700/80 bg-slate-800/80 text-slate-200 transition hover:border-indigo-500 hover:bg-slate-800">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <!-- Seletor direto de data + contadores -->
        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center gap-2 rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2 text-xs font-medium text-slate-300">
            <span>Pendentes: <strong id="count-pending" class="text-indigo-400">0</strong></span>
            <span class="text-slate-700">|</span>
            <span>Concluídas: <strong id="count-done" class="text-emerald-400">0</strong></span>
          </div>

          <input id="date-picker" type="date"
            class="rounded-xl border border-slate-700 bg-slate-800/90 px-3 py-2 text-xs font-semibold text-slate-200 outline-none transition focus:border-indigo-500 sm:text-sm [color-scheme:dark]" />
        </div>
      </div>

      <!-- Faixa rápida da semana -->
      <div id="week-strip" class="mt-4 grid grid-cols-7 gap-1.5 sm:gap-2.5"></div>
    </section>

    <!-- Painel Expansível: Ver Outros Dias -->
    <section id="other-days-panel" class="mb-6 hidden rounded-2xl border border-indigo-500/30 bg-slate-900/90 p-5 shadow-2xl">
      <div class="mb-4 flex items-center justify-between">
        <div>
          <h3 class="text-base font-bold text-white">Outros dias com tarefas</h3>
          <p class="text-xs text-slate-400">Clique em qualquer dia para abrir a agenda dele na tela principal</p>
        </div>
        <button id="btn-close-other-days"
          class="rounded-lg border border-slate-700 px-3 py-1.5 text-xs font-semibold text-slate-300 hover:bg-slate-800">
          Fechar
        </button>
      </div>
      <div id="other-days-grid" class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4"></div>
    </section>

    <!-- Formulário de Nova Tarefa -->
    <section class="mb-6 rounded-2xl border border-slate-800 bg-slate-900/70 p-4 shadow-lg sm:p-5">
      <form id="task-form" class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="relative flex-1">
          <input id="task-input" type="text" required placeholder="Adicionar nova tarefa para este dia..."
            class="w-full rounded-xl border border-slate-700/90 bg-slate-950/80 px-4 py-3.5 text-sm text-white placeholder-slate-500 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 sm:text-base" />
        </div>

        <div class="flex items-center gap-2.5">
          <!-- Botão Bandeira de Prioridade -->
          <button type="button" id="btn-new-priority"
            class="inline-flex items-center gap-2 rounded-xl border border-slate-700 bg-slate-800/80 px-4 py-3.5 text-sm font-semibold text-slate-300 transition hover:border-rose-500/60"
            title="Marcar como prioridade">
            <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
              <path d="M5 3v18h2v-
